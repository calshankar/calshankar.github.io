apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: example-push-secret
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: example-secret-store
      kind: SecretStore
  selector:
    secret:
      name: example-source-secret
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: /example/pushed/password
