apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: example-external-secret
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: example-secret-store
    kind: SecretStore
  target:
    name: example-synced-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: /example/app
        property: password
